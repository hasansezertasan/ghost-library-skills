name: Check

# Unfiltered on purpose: a required check must always report. Reusable so the
# release workflow runs the very same job before it releases.
on:
  push:
  pull_request:
  workflow_call:
  workflow_dispatch:

permissions: {}

jobs:
  check:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          enable-cache: false # Standard-library tooling; no dependency cache.
      - run: uv python install
      - run: npm ci
      - run: npm run check
      # Repo-specific: the Python unit tests and a disposable build of the host bundles.
      - run: python3 tools/check_owned_tree.py
      - run: python3 tools/build_skills.py --check
      - run: npm test
      - run: OUTPUT="$RUNNER_TEMP/plugins" npm run build
