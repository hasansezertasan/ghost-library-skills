name: Check

# Unfiltered on purpose: a required check must always report. Reusable so the
# release workflow runs the very same job before it releases.
on:
  push:
  pull_request:
  workflow_call:
  workflow_dispatch:

permissions: {}

jobs:
  check:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      # The npm scripts run Python through this, so CI uses the .python-version interpreter, not the runner's.
      PYTHON: uv run --no-project python
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: false # Standard-library tooling; no dependency cache.
      - run: uv python install
      - run: npm ci
      - run: npm run check
      # Repo-specific: the Python unit tests and a disposable build of the host bundles.
      - run: $PYTHON tools/build_skills.py --check
      - run: npm test
      - run: OUTPUT="$RUNNER_TEMP/plugins" npm run build
