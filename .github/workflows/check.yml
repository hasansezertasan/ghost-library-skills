name: check

on:
  pull_request:
  push:
    branches: [main]
  workflow_call:
  workflow_dispatch:
    inputs:
      ref:
        description: Commit or release PR branch to validate (empty uses this workflow's commit)
        type: string
        required: false

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.ref || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: .node-version
          cache: npm
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          enable-cache: false # Standard-library tooling; no dependency cache.
      - run: uv python install
      - name: Validate sources, generated packages, and disposable builds
        run: make check-all PYTHON="uv run --no-project python"
