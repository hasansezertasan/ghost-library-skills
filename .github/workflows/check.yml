name: check

on:
  pull_request:
  push:
    branches: [main]
  workflow_call:
  workflow_dispatch:
    inputs:
      ref:
        description: Commit or release PR branch to validate (empty uses this workflow's commit)
        type: string
        required: false

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.ref || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .node-version
          cache: npm
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          enable-cache: false # Standard-library tooling; no dependency cache.
      - run: uv python install
      - name: Validate sources, generated packages, and disposable builds
        run: make check-all PYTHON="uv run --no-project python"
