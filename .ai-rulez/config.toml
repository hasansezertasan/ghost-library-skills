# The plugin version comes from package.json; shared resources are copied into every skill.
# content_root keeps each skill's agents/ metadata in the bundle.
version = "5.0"
name = "ghost-library-skills"
gitignore = false

[plugin]
version_from = "package.json"
name = "ghost-library-skills"
description = "Maintain ghost-library specifications, portable fixtures, and downstream conformance evidence."
repository = "https://github.com/hasansezertasan/ghost-library-skills"
keywords = ["ghost-library", "specifications", "conformance", "skills", "pi-package"]
runtimes = ["claude", "codex", "pi"]
category = "Productivity"
content_root = ".ai-rulez"
shared_resources = ["references", "templates"]
provenance_headers = false

[plugin.author]
name = "Hasan Sezer Tasan"
url = "https://github.com/hasansezertasan"

[plugin.interface]
display_name = "Ghost Library Skills"
short_description = "Maintain behavioral contracts and portable fixtures"
category = "Development"
capabilities = ["Read", "Write"]
default_prompt = ["Audit this ghost library's contract and portable fixture coverage."]
long_description = "Maintain ghost-library specifications, portable fixtures, and downstream conformance evidence."
developer_name = "Hasan Sezer Tasan"

# Single-plugin catalogs point at the repository root ("./");
# ai-rulez fills the description and owner from [plugin].
[plugin.codex]
marketplace = true

# Pi reads the root skills/ tree; merge keeps the authored npm tooling in package.json.
# package_name keeps the plugin's npm name; skills_entry lists skills/ once instead of every skill.
[plugin.pi]
skills_dir = "skills"
package_json = "merge"
package_name = "ghost-library-skills"
skills_entry = "directory"

[marketplace]
name = "ghost-library-skills-marketplace"
